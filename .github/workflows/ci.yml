name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-core.txt
          pip install ruff mypy

      # 先使用 make check，确保 console/bff-py 不退化；
      # 后续全局 ruff/mypy 全绿后再推进到 make lint。
      - name: Lint & type check (console/bff-py)
        run: make check

      - name: Ruff format check
        run: ruff format --check engine/ tests/ console/bff-py/

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-core.txt
          pip install pytest pytest-cov hypothesis scipy numpy pandas pyarrow

      - name: Run tests with coverage
        run: |
          pytest tests/ -q --tb=short \
            --cov=engine \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration and not slow"

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # 阻塞式门禁：发现漏洞即失败（PYSEC-2022-43012 为已知豁免）
        run: pip-audit -r requirements-core.txt --ignore-vuln PYSEC-2022-43012

      - name: Ruff security & correctness rules
        # F（Pyflakes 正确性）+ S（Bandit 安全）阻塞式检查主包；
        # S110（try-except-pass）为本仓库刻意的静默降级风格，与 S101/S104/S311/S324 一并豁免
        run: |
          pip install ruff
          ruff check engine/ --select F,S --ignore S101,S104,S110,S311,S324

  go-suite:
    name: Go Microservices & BFF Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与根目录 go.work 声明的 go 1.27.0 保持一致，避免依赖 GOTOOLCHAIN 自动下载
          go-version: "1.27"
          cache-dependency-path: go.work.sum

      - name: Vet all Go packages
        run: |
          go vet ./pkg/...
          go vet ./services/service-hub/...
          go vet ./services/datasource-mgr/...
          go vet ./services/audit-log/...
          go vet ./console/bff-go/...

      - name: Test all Go modules
        run: go test ./pkg/... ./services/service-hub/... ./services/datasource-mgr/... ./services/audit-log/... ./console/bff-go/... -race -count=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: console/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test
        run: npx vitest --run

  console-bff-py:
    name: Console BFF (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/bff-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: console/bff-py/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest tests/ -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build core image
        run: docker build --target core -t privshield:ci .

      - name: Verify image starts
        run: |
          docker run --rm privshield:ci python -c \
            "from engine.service import PrivacyService; from PrivShield.service import PrivacyService as PS; print('OK')"

  helm-lint:
    name: Helm Chart Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --chart-dirs deploy/helm --validate-maintainers=false

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        run: ct install --chart-dirs deploy/helm --validate-maintainers=false

  image-scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Build core image
        run: docker build --target core -t PrivShield:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: PrivShield:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # 阻塞式门禁：存在 CRITICAL/HIGH 漏洞时 job 失败（exit-code 0 等于扫描形同虚设）
          exit-code: 1

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
