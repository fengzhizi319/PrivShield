# 默认开发 values，TLS/auth 关闭，便于本地测试。

replicaCount: 1

namespace:
  create: false

# 镜像选择：core 为轻量镜像，ml 包含 torch/transformers/onnxruntime
flavor: core

image:
  repository: privacy-local-agent
  pullPolicy: IfNotPresent
  # 留空时默认使用 Chart.appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # 是否创建 ServiceAccount
  create: true
  # 自定义 ServiceAccount 名称
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  restPort: 8079
  grpcPort: 50051
  # REST/gRPC 是否在同一 Service 中暴露
  exposeGrpc: true
  annotations: {}

# 应用配置
agent:
  logLevel: info
  logFormat: text
  # privacy-profile.yaml 内容（挂载到 /etc/privacy-local-agent/privacy-profile.yaml）。
  # 注意：代码（privacy/profile.py）仅读取 `primitives:` 段，按
  # primitives.<primitive> 覆盖内置默认参数；其他顶层键（如 server:/privacy:）
  # 不会被解析。监听地址等请改用 extraEnv 设置 PRIVACY_* 环境变量。
  # 下方取值与代码内置默认值一致（行为中性，仅作显式示例）：
  # dp: epsilon=1.0, delta=0.0, mechanism=laplace
  # k_anonymity: k=5, l=2, t=0.2, max_depth=10；sanitization: engine=mask
  profile: |
    primitives:
      dp:
        epsilon: 1.0
        delta: 0.0
        mechanism: "laplace"
      k_anonymity:
        k: 5
        l: 2
        t: 0.2
        max_depth: 10
      sanitization:
        engine: "mask"

# 安全开关
security:
  enabled: false
  tls:
    enabled: false
    # 用户自管 TLS Secret（包含 tls.crt / tls.key）
    existingSecret: ""
    # 也可直接填写证书内容（不推荐用于生产）
    cert: ""
    key: ""
    certFile: /certs/tls.crt
    keyFile: /certs/tls.key
    # mTLS 客户端证书校验模式：none / optional / require
    clientAuth: none
    # CA 证书 Secret（包含 ca.crt），clientAuth 为 optional/require 时必填
    caSecret: ""
    caFile: /certs/ca.crt
    # 私钥加密口令 Secret（可选，Secret 中须包含名为 key-password 的数据键）
    keyPasswordSecret: ""
  auth:
    enabled: false
    # 用户自管 API Key Secret（Secret 中须包含名为 api-keys.json 的数据键，
    # 内容为 JSON：{"<api-key>": {"name": "...", "scopes": [...]}}）
    apiKeysSecret: ""
    # 也可直接填写 api-keys.json 文件内容（不推荐用于生产），
    # Chart 会生成 <fullname>-secrets Secret 并以 api-keys.json 键挂载
    apiKeys: ""
    # 内部 mTLS 客户端证书认证（默认关闭，fail-closed）
    internalMtls:
      enabled: false
      # mTLS CN 白名单 YAML ConfigMap 名称（包含 mtls-whitelist.yaml 键）。
      # 设置后 PRIVACY_AUTH_MTLS_ALLOWED_CNS 被忽略。
      whitelistConfigMap: ""
      # 回退：静态 CN 列表（逗号分隔），当 whitelistConfigMap 未设置时使用
      allowedCns: ""
  # 速率限制
  rateLimit:
    enabled: false
    defaultRps: 10
    defaultBurst: 20
    # 分布式限速后端 Redis URL（不设置则进程内限速）
    redisUrl: ""
    # 按端点覆盖，JSON 对象字符串
    perEndpointJson: ""
  # 哪些路径可跳过认证，建议保留 /health
  publicPaths:
    - /health

# 资源限制
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# 探针
# liveness 使用 /health（轻量存活检查），readiness 使用 /readyz
# （/readyz 额外校验配置解析器与隐私预算 DB 连通性，未就绪时不接流量）。
probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# HPA
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior: {}

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: privacy-local-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# NetworkPolicy
networkPolicy:
  enabled: false
  ingress:
    # 允许访问的 Pod label selector 列表
    from: []

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # security.tls.enabled=true 时自动以 scheme=https 抓取 /metrics，并使用下方 tlsConfig。
  # 自签名证书场景默认 insecureSkipVerify；如需校验服务端证书，改为 CA 引用，例如：
  # tlsConfig:
  #   caFile: /etc/prometheus/secrets/<tls-secret-name>/tls.crt
  tlsConfig:
    insecureSkipVerify: true

# 节点亲和/容忍
nodeSelector: {}
tolerations: []
affinity: {}

# 额外环境变量
extraEnv: []

# 额外 volume/volumeMounts
extraVolumes: []
extraVolumeMounts: []
