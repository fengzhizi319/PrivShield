# 生产环境 values
# 使用说明：
#   helm install pla ./deploy/helm/PrivShield \
#     -f ./deploy/helm/PrivShield/values-production.yaml \
#     --set security.tls.existingSecret=your-tls-secret \
#     --set security.auth.apiKeysSecret=your-apikeys-secret

replicaCount: 2

flavor: core

agent:
  logLevel: info
  logFormat: json

security:
  tls:
    enabled: true
    existingSecret: ""  # 必填
  auth:
    enabled: true
    apiKeysSecret: ""   # 必填
  rateLimit:
    enabled: true

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true
  ingress:
    from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: PrivShield

serviceMonitor:
  enabled: true
