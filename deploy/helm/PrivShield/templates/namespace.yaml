# =============================================================================
# PrivShield 命名空间（namespace.yaml）
# =============================================================================
# 自动创建 K8s Namespace（仅在 namespace.create=true 时创建）。
# 默认关闭，建议手动创建或使用 --namespace 指定已有命名空间。
# =============================================================================
{{- if .Values.namespace.create -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "PrivShield.fullname" . }}
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
{{- end }}
