# =============================================================================
# PrivShield Prometheus ServiceMonitor（servicemonitor.yaml）
# =============================================================================
# ServiceMonitor 是 Prometheus Operator 的 CRD，定义 Prometheus 如何抓取本服务的 /metrics。
# 仅在 serviceMonitor.enabled=true 时创建（需集群安装 Prometheus Operator）。
# =============================================================================
{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "PrivShield.fullname" . }}
  # ServiceMonitor 所在命名空间（留空则与 Release 同命名空间）
  {{- if .Values.serviceMonitor.namespace }}
  namespace: {{ .Values.serviceMonitor.namespace | quote }}
  {{- else }}
  namespace: {{ .Release.Namespace | quote }}
  {{- end }}
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
    # 额外标签（常用于 Prometheus 的 serviceMonitorSelector 匹配）
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # 通过 selectorLabels 匹配主 Service
  selector:
    matchLabels:
      {{- include "PrivShield.selectorLabels" . | nindent 6 }}
  endpoints:
    # 抓取 /metrics 端点
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # TLS 启用时自动切换 HTTPS 抓取
      {{- if .Values.security.tls.enabled }}
      scheme: https
      tlsConfig:
        {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
      {{- end }}
{{- end }}
