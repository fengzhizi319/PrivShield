# =============================================================================
# PrivShield ServiceAccount（serviceaccount.yaml）
# =============================================================================
# 定义 Pod 运行时使用的服务账户，用于 RBAC 权限控制和身份标识。
# 仅在 serviceAccount.create=true 时创建（默认启用）。
# =============================================================================
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "PrivShield.serviceAccountName" . }}
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
  # ServiceAccount 注解（常用于云厂商 IAM 绑定，如 AWS IRSA）
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
