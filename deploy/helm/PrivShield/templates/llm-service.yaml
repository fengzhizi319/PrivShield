{{- if .Values.llm.enabled }}
# ── Layer-3 LLM 推理服务入口 ──
# core 通过 <fullname>-llm:<port>/v1 调用（PRIVACY_LLM_API_BASE 已由 deployment.yaml 注入）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "PrivShield.fullname" . }}-llm
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  type: ClusterIP
  selector:
    {{- include "PrivShield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm
  ports:
    - name: http
      port: {{ .Values.llm.port }}
      targetPort: http
{{- end }}
