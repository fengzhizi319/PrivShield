# =============================================================================
# PrivShield 主服务 Deployment（deployment.yaml）
# =============================================================================
# 定义 PrivShield 主容器的 Deployment，包含 REST + gRPC 双端口。
# 环境变量通过 values.yaml 注入，敏感数据通过 Secret/ConfigMap 卷挂载。
#
# Helm 部署流程：
#   1. helm install 读取 values.yaml（默认值）+ 用户覆盖值（-f / --set）
#   2. Helm 模板引擎将 Go Template 占位符替换为实际值，渲染为纯 K8s YAML
#   3. 渲染后的 YAML 提交给 K8s API Server（等价 kubectl apply）
#   4. K8s 创建 Pod，kubelet 根据 env: 字段注入环境变量到容器
#   5. 容器内 Python 进程通过 os.getenv() 读取环境变量
#
# 注意：Helm 本身不"加载"环境变量——它只负责模板渲染。
#       真正注入环境变量的是 K8s kubelet（容器启动时）。
#
# 预览渲染结果：helm template pla ./deploy/helm/PrivShield --debug
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "PrivShield.fullname" . }}
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
spec:
  # HPA 启用时副本数由 HPA 自动管理，此处不设置
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # 滚动更新策略（零停机更新）
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "PrivShield.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Pod 注解（如 Prometheus scrape、Jaeger tracing 等）
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "PrivShield.selectorLabels" . | nindent 8 }}
    spec:
      # 私有镜像仓库认证 Secret
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "PrivShield.serviceAccountName" . }}
      # Pod 级安全上下文（runAsNonRoot/runAsUser/fsGroup）
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # 优雅终止宽限期（SIGTERM 后等待容器自行退出）
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # 容器级安全上下文（最小权限原则）
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "PrivShield.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.restPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            # ── 基础配置 ──
            - name: PRIVACY_REST_HOST
              value: "0.0.0.0"
            - name: PRIVACY_REST_PORT
              value: "{{ .Values.service.restPort }}"
            - name: PRIVACY_GRPC_HOST
              value: "0.0.0.0"
            - name: PRIVACY_GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
            - name: PRIVACY_PROFILE
              value: "/etc/PrivShield/privacy-profile.yaml"
            - name: PRIVACY_LOG_LEVEL
              value: {{ .Values.agent.logLevel | upper | quote }}
            - name: PRIVACY_LOG_FORMAT
              value: {{ .Values.agent.logFormat | quote }}
            - name: PRIVACY_SERVICE_NAME
              value: {{ include "PrivShield.fullname" . | quote }}
            # ── OpenTelemetry 可观测性（可选）──
            {{- with .Values.agent.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            # ── TLS 加密传输（可选）──
            {{- if .Values.security.tls.enabled }}
            - name: PRIVACY_TLS_ENABLED
              value: "true"
            - name: PRIVACY_TLS_CERT_FILE
              value: {{ .Values.security.tls.certFile | quote }}
            - name: PRIVACY_TLS_KEY_FILE
              value: {{ .Values.security.tls.keyFile | quote }}
            - name: PRIVACY_TLS_CLIENT_AUTH
              value: {{ .Values.security.tls.clientAuth | default "none" | quote }}
            {{- if .Values.security.tls.caSecret }}
            - name: PRIVACY_TLS_CA_FILE
              value: {{ .Values.security.tls.caFile | quote }}
            {{- end }}
            {{- if .Values.security.tls.keyPasswordSecret }}
            - name: PRIVACY_TLS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.tls.keyPasswordSecret | quote }}
                  key: key-password
            {{- end }}
            {{- end }}
            # ── API Key 认证（可选）──
            {{- if .Values.security.auth.enabled }}
            - name: PRIVACY_AUTH_ENABLED
              value: "true"
            {{- if .Values.security.auth.apiKeysSecret }}
            # 外部 Secret（用户自管）
            - name: PRIVACY_AUTH_EXTERNAL_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.auth.apiKeysSecret | quote }}
                  key: api-keys.json
            {{- else if .Values.security.auth.apiKeys }}
            # Chart 自动生成的 Secret
            - name: PRIVACY_AUTH_EXTERNAL_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "PrivShield.fullname" . }}-secrets
                  key: api-keys.json
            {{- end }}
            {{- end }}
            # ── 内部 mTLS 客户端证书认证（可选）──
            {{- if .Values.security.auth.internalMtls.enabled }}
            - name: PRIVACY_AUTH_INTERNAL_MTLS_ENABLED
              value: "true"
            {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
            - name: PRIVACY_AUTH_MTLS_WHITELIST_FILE
              value: "/etc/PrivShield/mtls-whitelist.yaml"
            {{- else if .Values.security.auth.internalMtls.allowedCns }}
            - name: PRIVACY_AUTH_MTLS_ALLOWED_CNS
              value: {{ .Values.security.auth.internalMtls.allowedCns | quote }}
            {{- end }}
            {{- end }}
            # ── 速率限制（可选）──
            {{- if .Values.security.rateLimit.enabled }}
            - name: PRIVACY_RATE_LIMIT_ENABLED
              value: "true"
            - name: PRIVACY_RATE_LIMIT_DEFAULT_RPS
              value: {{ .Values.security.rateLimit.defaultRps | quote }}
            - name: PRIVACY_RATE_LIMIT_DEFAULT_BURST
              value: {{ .Values.security.rateLimit.defaultBurst | quote }}
            {{- if .Values.security.rateLimit.redisUrl }}
            - name: PRIVACY_RATE_LIMIT_REDIS_URL
              value: {{ .Values.security.rateLimit.redisUrl | quote }}
            {{- end }}
            {{- if .Values.security.rateLimit.perEndpointJson }}
            - name: PRIVACY_RATE_LIMIT_PER_ENDPOINT_JSON
              value: {{ .Values.security.rateLimit.perEndpointJson | quote }}
            {{- end }}
            {{- end }}
            # ── Layer-3 LLM 推理服务连接（可选）──
            {{- if .Values.llm.enabled }}
            - name: PRIVACY_LLM_PROVIDER
              value: {{ .Values.llm.provider | default "vllm" | quote }}
            - name: PRIVACY_LLM_API_BASE
              value: "http://{{ include "PrivShield.fullname" . }}-llm:{{ .Values.llm.port }}/v1"
            - name: PRIVACY_LLM_MODEL_NAME
              value: {{ .Values.llm.servedModelName | quote }}
            - name: PRIVACY_LLM_API_KEY
              value: {{ .Values.llm.apiKey | default "EMPTY" | quote }}
            {{- end }}
            # ── 额外环境变量（用户自定义）──
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # 配置文件卷（privacy-profile.yaml）
            - name: config
              mountPath: /etc/PrivShield
              readOnly: true
            # TLS 证书卷（可选）
            {{- if .Values.security.tls.enabled }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            # CA 证书（可选，mTLS 场景）
            {{- if .Values.security.tls.caSecret }}
            - name: ca-cert
              mountPath: {{ .Values.security.tls.caFile }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
            # mTLS CN 白名单 ConfigMap（可选）
            {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
            - name: mtls-whitelist
              mountPath: /etc/PrivShield/mtls-whitelist.yaml
              subPath: mtls-whitelist.yaml
              readOnly: true
            {{- end }}
            # 额外卷挂载（用户自定义）
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # ── 探针配置 ──
          # TLS 启用时使用 exec 探针（curl/wget 加 -k 跳过证书校验）
          # TLS 未启用时使用 httpGet 探针（更轻量）
          {{- if .Values.security.tls.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.liveness.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.liveness.path }}"
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.readiness.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.readiness.path }}"
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.startup.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.startup.path }}"
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          # 资源限制（CPU/内存）
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # ── 卷定义 ──
      volumes:
        # 配置文件卷（从 ConfigMap 挂载 privacy-profile.yaml）
        - name: config
          configMap:
            name: {{ include "PrivShield.fullname" . }}-config
        # TLS 证书卷（从 Secret 挂载）
        {{- if .Values.security.tls.enabled }}
        - name: tls-certs
          secret:
            {{- if .Values.security.tls.existingSecret }}
            secretName: {{ .Values.security.tls.existingSecret | quote }}
            {{- else }}
            secretName: {{ include "PrivShield.fullname" . }}-secrets
            {{- end }}
        {{- if .Values.security.tls.caSecret }}
        - name: ca-cert
          secret:
            secretName: {{ .Values.security.tls.caSecret | quote }}
        {{- end }}
        {{- end }}
        # mTLS CN 白名单 ConfigMap 卷
        {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
        - name: mtls-whitelist
          configMap:
            name: {{ .Values.security.auth.internalMtls.whitelistConfigMap | quote }}
        {{- end }}
        # 额外卷（用户自定义）
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      # ── 节点调度 ──
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
