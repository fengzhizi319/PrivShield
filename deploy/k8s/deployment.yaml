apiVersion: apps/v1
kind: Deployment
metadata:
  name: PrivShield
  namespace: PrivShield
  labels:
    app: PrivShield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PrivShield
  template:
    metadata:
      labels:
        app: PrivShield
    spec:
      # Pod 级安全上下文：强制非 root 运行、卷文件属组
      # 与 Helm chart values.yaml podSecurityContext 对齐
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # 优雅终止宽限期：gRPC GracefulStop 30s + 余量
      terminationGracePeriodSeconds: 40
      containers:
        - name: agent
          image: privshield:1.8.0
          imagePullPolicy: IfNotPresent
          # 容器级安全上下文：最小权限原则
          # 与 Helm chart values.yaml securityContext 对齐
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8079
            - name: grpc
              containerPort: 50051
          env:
            - name: PRIVACY_REST_HOST
              value: "0.0.0.0"
            - name: PRIVACY_REST_PORT
              value: "8079"
            - name: PRIVACY_GRPC_HOST
              value: "0.0.0.0"
            - name: PRIVACY_GRPC_PORT
              value: "50051"
            - name: PRIVACY_PROFILE
              value: "/etc/PrivShield/privacy-profile.yaml"
            - name: PRIVACY_LOG_LEVEL
              value: "INFO"
            - name: PRIVACY_LOG_FORMAT
              value: "text"
            # 如需启用 TLS，取消下面注释并确保证书 Secret 已创建
            # - name: PRIVACY_TLS_ENABLED
            #   value: "true"
            # - name: PRIVACY_TLS_CERT_FILE
            #   value: "/certs/tls.crt"
            # - name: PRIVACY_TLS_KEY_FILE
            #   value: "/certs/tls.key"
            # 如需启用认证，取消下面注释并确保 API Key Secret 已创建
            # - name: PRIVACY_AUTH_ENABLED
            #   value: "true"
            # - name: PRIVACY_AUTH_EXTERNAL_KEYS_JSON
            #   valueFrom:
            #     secretKeyRef:
            #       name: PrivShield-apikeys
            #       key: api-keys.json
            # 如需启用 Layer-3 LLM 独立推理服务（运行时解耦），取消下面注释并部署
            # llm-deployment.yaml / llm-service.yaml（LLM 挂掉时 core 自动降级 Layer-1+2）：
            # - name: PRIVACY_LLM_PROVIDER
            #   value: "vllm"
            # - name: PRIVACY_LLM_API_BASE
            #   value: "http://PrivShield-llm:8000/v1"
            # - name: PRIVACY_LLM_MODEL_NAME
            #   value: "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
            # - name: PRIVACY_LLM_API_KEY
            #   value: "EMPTY"
          volumeMounts:
            - name: config
              mountPath: /etc/PrivShield
              readOnly: true
            # - name: tls-certs
            #   mountPath: /certs
            #   readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              # /readyz 校验配置解析器与隐私预算 DB 连通性；liveness 保持 /health
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # startupProbe: 启动探针——保护慢启动应用（如 ML 模型加载）
          # 在 startupProbe 成功前，liveness/readiness 探针不会生效，
          # 避免 K8s 在应用尚未就绪时过早重启 Pod。
          # 最多允许 30 × 5s = 150s 启动时间。
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: PrivShield-config
        # - name: tls-certs
        #   secret:
        #     secretName: PrivShield-tls
