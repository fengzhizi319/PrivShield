# =============================================================================
# Layer-3 LLM 推理服务入口
# core 通过 http://PrivShield-llm:8000/v1 调用（OpenAI 兼容）。
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: PrivShield-llm
  namespace: PrivShield
  labels:
    app: PrivShield-llm
spec:
  type: ClusterIP
  selector:
    app: PrivShield-llm
  ports:
    - name: http
      port: 8000
      targetPort: http
