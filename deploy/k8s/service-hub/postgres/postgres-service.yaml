# Phase B: PostgreSQL ClusterIP Service.
# 阶段 B：PostgreSQL ClusterIP 服务。
apiVersion: v1
kind: Service
metadata:
  name: service-hub-postgres
  labels:
    app.kubernetes.io/name: service-hub-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: service-hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-hub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
