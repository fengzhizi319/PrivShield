# Phase B: PostgreSQL credentials Secret template.
# 阶段 B：PostgreSQL 凭据 Secret 模板。
#
# 部署前请替换 base64 编码的凭据值：
#   echo -n "privshield" | base64   => cHJpdnNoaWVsZA==
#   echo -n "CHANGE_ME_STRONG_PASSWORD" | base64
apiVersion: v1
kind: Secret
metadata:
  name: service-hub-postgres-secret
  labels:
    app.kubernetes.io/name: service-hub-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: service-hub
type: Opaque
data:
  # Default: privshield (base64)
  username: cHJpdnNoaWVsZA==
  # CHANGE ME: replace with a strong password before deploying
  password: Q0hBTkdFX01FX1NUUk9OR19QQVNTV09SRA==
