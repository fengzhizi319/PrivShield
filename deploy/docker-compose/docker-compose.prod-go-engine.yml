# =============================================================================
# PrivShield - Go Engine Override for docker-compose.prod.yml
# PrivShield - Go 原生引擎替代覆盖层（生产模式）
#
# 使用方式 / Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-go-engine.yml up -d
#
# 或通过脚本启动：
#   bash scripts/prod/deploy-docker-compose.sh --go-engine
#
# 说明：
#   本文件覆盖 docker-compose.prod.yml 中的 PrivShield 服务定义，
#   将 Python 引擎替换为 Go 原生引擎（engine-go/Dockerfile 构建）。
#   Go 引擎镜像极小（~15MB），启动速度快（<1s），无 Python/ML 依赖。
#   生产模式下：JSON 日志、安全加固（no-new-privileges）、自动重启。
#
# 环境变量：
#   PRIVSHIELD_GO_IMAGE: Go 引擎镜像名（默认 privshield-go:1.0.0）
# =============================================================================

services:

  # 覆盖 docker-compose.prod.yml 中的 PrivShield 服务定义
  PrivShield:
    # 使用 Go 引擎镜像
    image: ${PRIVSHIELD_GO_IMAGE:-privshield-go:1.0.0}
    # Go 引擎不需要本地构建
    build: null
    pull_policy: if_not_present
    container_name: PrivShield-Go-prod
    # 生产安全加固
    security_opt:
      - no-new-privileges:true
    environment:
      # Go 引擎基础配置
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-INFO}"
      PRIVACY_LOG_FORMAT: "json"
      PRIVACY_SERVICE_NAME: "PrivShield-Go"
      # 生产模式：从 .env 读取安全配置
      PRIVACY_TLS_ENABLED: "${PRIVACY_TLS_ENABLED:-false}"
      PRIVACY_AUTH_ENABLED: "${PRIVACY_AUTH_ENABLED:-false}"
      PRIVACY_RATE_LIMIT_ENABLED: "${PRIVACY_RATE_LIMIT_ENABLED:-false}"
    # Go 引擎不需要 Python 源码/配置挂载
    volumes:
      - budget-db:/data/budget
    # Go 引擎 healthcheck
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Go 引擎资源配额（生产级，远低于 Python 引擎）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    # Go 引擎 gRPC GracefulStop 更快
    stop_grace_period: 15s
    # 生产模式：自动重启
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
