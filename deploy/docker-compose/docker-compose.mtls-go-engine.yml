# =============================================================================
# PrivShield - mTLS Mutual TLS Security Overlay for Go Engine
# PrivShield - Go 原生引擎 mTLS 双向认证覆盖层
# =============================================================================
# 用法 / Usage:
#   docker compose -f docker-compose.yml -f docker-compose.go-engine.yml -f docker-compose.mtls-go-engine.yml up -d
# =============================================================================

services:

  # 1. PrivShield-Go 引擎 (mTLS 双向认证 + HTTPS REST)
  PrivShield:
    environment:
      PRIVACY_TLS_ENABLED: "true"
      PRIVACY_TLS_CERT_FILE: "/certs/server.crt"
      PRIVACY_TLS_KEY_FILE: "/certs/server.key"
      PRIVACY_TLS_CA_FILE: "/certs/ca.crt"
      PRIVACY_AUTH_INTERNAL_MTLS_ENABLED: "true"
      PRIVACY_AUTH_MTLS_ALLOWED_CNS: '["privshield-client", "privacy-console-go-client"]'
    volumes:
      - ../../console/bff-go/certs:/certs:ro
      - budget-db:/data/budget
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8079/readyz || wget --no-check-certificate -qO- https://localhost:8079/health || exit 1"]

  # 2. Console Go 后端代理服务 (mTLS 客户端连接 Go Agent)
  console-backend-go:
    environment:
      PRIVACY_AGENT_TLS_ENABLED: "true"
      PRIVACY_AGENT_TLS_CA_FILE: "/certs/ca.crt"
      PRIVACY_AGENT_TLS_CERT_FILE: "/certs/client.crt"
      PRIVACY_AGENT_TLS_KEY_FILE: "/certs/client.key"
      PRIVACY_AGENT_TLS_SERVER_NAME: "PrivShield"
      PRIVACY_AGENT_URL: "https://PrivShield:8079"
    volumes:
      - ../../console/bff-go/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/health || exit 1"]
