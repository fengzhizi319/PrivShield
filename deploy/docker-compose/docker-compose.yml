version: "3.9"

services:
  # ============================================================================
  # 1. Privacy Local Agent 核心 Sidecar 服务
  # REST: 8079 | gRPC: 50051
  # ============================================================================
  privacy-local-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: core
    image: privacy-local-agent:0.1.0
    container_name: privacy-local-agent
    ports:
      - "8079:8079"
      - "50051:50051"
    environment:
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_PROFILE: "/etc/privacy-local-agent/privacy-profile.yaml"
      PRIVACY_LOG_LEVEL: "INFO"
      PRIVACY_LOG_FORMAT: "text"
      # 如需关联下方的 vLLM 服务，取消注释并设置如下：
      # PRIVACY_ENV_PROFILE: "vllm"
      # PRIVACY_LLM_API_BASE: "http://vllm:8000/v1"
    volumes:
      - ./privacy-profile.yaml:/etc/privacy-local-agent/privacy-profile.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ============================================================================
  # 2. Console Go 后端代理服务 (Go gRPC / REST 高性能代理)
  # PORT: 8081
  # ============================================================================
  console-backend-go:
    build:
      context: ../../console/backend-go
      dockerfile: Dockerfile
    image: privacy-console-backend-go:0.1.0
    container_name: privacy-console-backend-go
    ports:
      - "8081:8081"
    environment:
      HOST: "0.0.0.0"
      PORT: "8081"
      PRIVACY_AGENT_GRPC_ADDR: "privacy-local-agent:50051"
      PRIVACY_AGENT_REST_ADDR: "http://privacy-local-agent:8079"
    depends_on:
      privacy-local-agent:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 3. Console Python 后端代理服务 (Python FastAPI REST 代理)
  # PORT: 8080
  # ============================================================================
  console-backend-python:
    build:
      context: ../../console/backend
      dockerfile: Dockerfile
    image: privacy-console-backend-python:0.1.0
    container_name: privacy-console-backend-python
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      AGENT_API_URL: "http://privacy-local-agent:8079"
    depends_on:
      privacy-local-agent:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # 4. Console React 单页测试控制台 Web UI (Nginx 静态服务 / 代理)
  # PORT: 5173
  # ============================================================================
  console-web:
    build:
      context: ../../console/web
      dockerfile: Dockerfile
    image: privacy-console-web:0.1.0
    container_name: privacy-console-web
    ports:
      - "5173:5173"
    depends_on:
      - console-backend-go
      - console-backend-python
    restart: unless-stopped

  # ============================================================================
  # 5. 可选：vLLM Layer-3 本地大模型推理服务 (GPU 加速)
  # PORT: 8000
  # 启用说明：使用 docker-compose --profile llm up -d 启动
  # ============================================================================
  vllm:
    profiles: ["llm"]
    image: vllm/vllm-openai:latest
    container_name: privacy-local-agent-vllm
    command: ["--model", "/models/Qwen3.5-0.8B-Privacy-Classifier-Smoother", "--gpu-memory-utilization", "0.90"]
    volumes:
      - ../../.models:/models:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
