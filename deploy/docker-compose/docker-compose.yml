# =============================================================================
# Privacy Local Agent - Docker Compose 全栈编排
# Privacy Local Agent - Full Stack Docker Compose Orchestration
#
# 服务拓扑 / Service Topology:
#   ┌─────────────────┐     ┌────────────────────┐
#   │   Console Web   │────▶│ Console Backend Go │
#   │    (Nginx)      │     │    (gRPC/REST)     │
#   │     :5173       │     │      :8081         │
#   └─────────────────┘     └─────────┬──────────┘
#                                      │
#                            ┌─────────▼──────────┐
#                            │ Privacy Local Agent │
#                            │   REST:8079 gRPC    │
#                            │      :50051         │
#                            └─────────────────────┘
#
# 启动方式 / Usage:
#   docker compose up -d                    # 启动核心服务（不含 LLM，纯 core 镜像）
#   docker compose --profile llm up -d      # 启用 vLLM GPU 推理（独立 LLM 容器）
#   docker compose --profile llm up -d vllm # 仅启动/升级 LLM 服务，core 无感知
#   docker compose restart vllm             # LLM 单独重启，core 自动降级到规则+NER 层
#   docker compose --profile monitoring up  # 启用监控栈
#
# 运行时解耦设计 / Runtime Decoupling:
#   core 镜像（无 torch）与 vLLM 推理容器完全独立：
#   - LLM 升级/重启        → core 零感知（HTTP 短连接，自动重试）
#   - LLM 挂掉/OOM         → core 自动降级 Layer-1 规则 + Layer-2 NER，REST/gRPC 不受影响
#   - LLM 依赖变更          → 只重建 vllm 容器，core 镜像永不重建
# =============================================================================

# =============================================================================
# 网络定义 / Networks
# =============================================================================
networks:
  # 前端网络：Web UI 访问
  # Frontend network: Web UI access
  frontend:
    driver: bridge

  # 后端网络：Agent 核心服务与后端代理通信
  # Backend network: Agent core service and backend proxy communication
  backend:
    driver: bridge
    internal: true  # 不对外暴露，仅内部通信

  # LLM 网络：大模型推理服务（可选）
  # LLM network: Large model inference service (optional)
  llm:
    driver: bridge
    internal: true

# =============================================================================
# 持久化卷定义 / Volumes
# =============================================================================
volumes:
  # 隐私预算数据库（SQLite）
  # Privacy budget database (SQLite)
  budget-db:
    driver: local

  # 审计日志持久化
  # Audit log persistence
  audit-logs:
    driver: local

  # Prometheus 持久化数据
  # Prometheus persisted data
  prometheus-data:
    driver: local

  # Grafana 持久化数据
  # Grafana persisted data
  grafana-data:
    driver: local

# =============================================================================
# 服务定义 / Services
# =============================================================================
services:

  # ===========================================================================
  # 1. Privacy Local Agent 核心 Sidecar 服务
  #    REST: 8079 | gRPC: 50051
  # ===========================================================================
  privacy-local-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: core
    image: privacy-local-agent:0.1.0
    container_name: privacy-local-agent
    # 读取项目根目录 .env 作为基础配置（运维统一入口）
    # Load project root .env as base config (single ops entry point)
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "8079:8079"   # REST API
      - "50051:50051" # gRPC
    environment:
      # ── 容器覆盖项 / Container overrides ──
      # 容器内必须绑定 0.0.0.0（.env 中的 127.0.0.1 仅适用于宿主机开发）
      # Must bind 0.0.0.0 inside container (.env 127.0.0.1 is for host dev only)
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      # 容器环境推荐 JSON 日志格式
      # JSON log format recommended for container environments
      PRIVACY_LOG_FORMAT: "json"
      # 容器内 profile 配置挂载路径（通过 volume 映射）
      # Profile config mount path inside container (via volume mount)
      PRIVACY_PROFILE: "/etc/privacy-local-agent/privacy-profile.yaml"
      # 持久化预算数据库路径
      # Persisted budget database path
      PRIVACY_BUDGET_DB: "/data/budget/budget.db"
      # ── Layer-3 LLM 推理服务连接（运行时解耦）──
      # vLLM 独立容器（服务名 vllm:8000）承载 LLM 推理，core 通过 OpenAI 兼容 HTTP 调用：
      #   - LLM 升级/重启 → core 零感知（短连接自动重试）
      #   - LLM 挂掉/OOM  → core 自动降级 Layer-1+Layer-2（信号量等待/内存阈值兜底）
      # 如业务不需要 LLM（纯 core 模式），注释掉以下 4 行即可
      PRIVACY_LLM_PROVIDER: "vllm"
      PRIVACY_LLM_API_BASE: "http://vllm:8000/v1"
      PRIVACY_LLM_MODEL_NAME: "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      PRIVACY_LLM_API_KEY: "EMPTY"
      # ── 可选：安全配置 / Optional: security config ──
      # 生产环境请在 .env 中取消注释 TLS/Auth/RateLimit 配置
      # For production, uncomment TLS/Auth/RateLimit in .env
      # PRIVACY_TLS_ENABLED: "true"
      # PRIVACY_TLS_CERT_FILE: "/certs/tls.crt"
      # PRIVACY_TLS_KEY_FILE: "/certs/tls.key"
      # PRIVACY_AUTH_ENABLED: "true"
    volumes:
      - ./privacy-profile.yaml:/etc/privacy-local-agent/privacy-profile.yaml:ro
      - budget-db:/data/budget
      - audit-logs:/var/log/privacy
    networks:
      - backend
      - llm  # 允许访问 LLM 服务
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 资源限制 / Resource limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    # 日志配置 / Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # ===========================================================================
  # 2. Console Go 后端代理服务 (Go gRPC / REST 高性能代理)
  #    PORT: 8081
  # ===========================================================================
  console-backend-go:
    build:
      context: ../../console/backend-go
      dockerfile: Dockerfile
    image: privacy-console-backend-go:0.1.0
    container_name: privacy-console-backend-go
    ports:
      - "8081:8081"
    environment:
      PRIVACY_CONSOLE_HOST: "0.0.0.0"
      PRIVACY_CONSOLE_PORT: "8081"
      PRIVACY_AGENT_GRPC_HOST: "privacy-local-agent"
      PRIVACY_AGENT_GRPC_PORT: "50051"
    depends_on:
      privacy-local-agent:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # 资源限制 / Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # ===========================================================================
  # 3. Console Python 后端代理服务 (Python FastAPI REST 代理)
  #    PORT: 8080
  # ===========================================================================
  console-backend-python:
    build:
      context: ../../console/backend
      dockerfile: Dockerfile
    image: privacy-console-backend-python:0.1.0
    container_name: privacy-console-backend-python
    ports:
      - "8080:8080"
    environment:
      PRIVACY_CONSOLE_HOST: "0.0.0.0"
      PRIVACY_CONSOLE_PORT: "8080"
      PRIVACY_AGENT_URL: "http://privacy-local-agent:8079"
    depends_on:
      privacy-local-agent:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # 资源限制 / Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # ===========================================================================
  # 4. Console React 单页测试控制台 Web UI (Nginx 静态服务)
  #    PORT: 5173
  # ===========================================================================
  console-web:
    build:
      context: ../../console/web
      dockerfile: Dockerfile
    image: privacy-console-web:0.1.0
    container_name: privacy-console-web
    ports:
      - "5173:5173"
    depends_on:
      privacy-local-agent:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # 资源限制 / Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped

  # ===========================================================================
  # 5. 可选：vLLM Layer-3 本地大模型推理服务 (GPU 加速，独立容器)
  #    PORT: 8000
  #    启用：docker compose --profile llm up -d vllm
  #    独立运维：升级/重启只影响 LLM 层，core 自动降级，互不干扰
  # ===========================================================================
  vllm:
    profiles: ["llm"]
    # Qwen3.5 为混合注意力架构（Gated Delta Net + Full Attention），需较新 vLLM：
    #   - llmlora 评估环境实测 vLLM 0.26+（见 docs/llmlora/finetuning_and_eval_guide.md §2.2）
    #   - 旧镜像 v0.6.3（2024 年）无法加载 Qwen3.5，此处默认 latest
    #   - 生产环境建议固定 tag（如 ${VLLM_IMAGE_TAG} 指定 v0.26.x）保证可复现
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    container_name: privacy-local-agent-vllm
    command:
      - "--model"
      - "/models/Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--served-model-name"
      - "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--max-model-len"
      - "4096"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ../../.models:/models:ro
    ports:
      - "8000:8000"
    networks:
      - llm
    healthcheck:
      # vLLM OpenAI 兼容 /health 端点（容器内 python 探测，无需额外安装 curl）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s  # vLLM 首次加载模型约 22s+，给足宽限
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # 限制为 1 张 GPU，支持多租户
              capabilities: [gpu]
        limits:
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    restart: unless-stopped

  # ===========================================================================
  # 6. 可选：Prometheus 监控服务
  #     PORT: 9090
  #     启用：docker compose --profile monitoring up -d
  # ===========================================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: privacy-local-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/rules/privacy-local-agent-alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - frontend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # ===========================================================================
  # 7. 可选：Grafana 可视化面板
  #     PORT: 3000
  #     启用：docker compose --profile monitoring up -d
  # ===========================================================================
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: privacy-local-agent-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"  # 必须通过 .env 或环境变量设置！
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - frontend
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
