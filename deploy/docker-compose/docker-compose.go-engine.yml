# =============================================================================
# PrivShield - Go Engine Override for Docker Compose
# PrivShield - Go 原生引擎替代覆盖层
#
# 使用方式 / Usage:
#   docker compose -f docker-compose.yml -f docker-compose.go-engine.yml up -d
#
# 或通过脚本启动：
#   bash scripts/dev/docker-start-go-all.sh
#   bash scripts/dev/docker-start-bff-go-agent.sh
#
# 说明：
#   本文件覆盖主 docker-compose.yml 中的 PrivShield 服务定义，
#   将 Python 引擎镜像替换为 Go 原生引擎（engine-go/Dockerfile 构建）。
#   Go 引擎镜像极小（~15MB），启动速度快（<1s），无 Python/ML 依赖。
#
# 环境变量：
#   PRIVSHIELD_GO_IMAGE: Go 引擎镜像名（默认 privshield-go:1.0.0）
# =============================================================================

services:

  # 覆盖主文件中的 PrivShield 服务定义
  PrivShield:
    # 使用 Go 引擎镜像（通过环境变量可覆盖）
    image: ${PRIVSHIELD_GO_IMAGE:-privshield-go:1.0.0}
    # Go 引擎不需要本地构建（由启动脚本预先构建）
    build: null
    pull_policy: if_not_present
    container_name: PrivShield-Go
    environment:
      # Go 引擎环境变量
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-INFO}"
      PRIVACY_LOG_FORMAT: "json"
      # Go 引擎不需要 Python 特有的配置
      # PRIVACY_PROFILE, PRIVACY_BUDGET_DB 等由 Go 引擎内部处理
    # Go 引擎不需要 Python 的 volumes 挂载
    volumes:
      - budget-db:/data/budget
    # Go 引擎启动极快，healthcheck 间隔可以缩短
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8079/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Go 引擎资源消耗远低于 Python 引擎
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    # Go 引擎 gRPC GracefulStop 更快
    stop_grace_period: 15s
