# =============================================================================
# PrivShield - 生产级 Docker Compose 编排 (Production Orchestration)
# =============================================================================
# 生产环境专用编排文件，提供：
#   1. 全链路 TLS 强加密传输与 API Key 鉴权
#   2. 生产级 JSON 结构化日志，便于集中式日志收集 (ELK / Loki)
#   3. 分布式限流支持 (可选集成 Redis 后端)
#   4. 严格的容器资源配额 (Limits / Reservations) 与安全加固 (no-new-privileges)
#   5. 纯生产镜像运行（不挂载宿主机源码），保障环境一致性
#   6. 容器异常自动重启策略 (restart: always)
#   7. 持久化数据命名卷 (SQLite 预算库、审计日志、Redis、Prometheus、Grafana)
#
# 🚀 启动方式 / Usage:
#   # 1. 基础生产模式（Core Agent + Go 代理 + Nginx Web + Redis 限流）
#   docker compose -f docker-compose.prod.yml up -d
#
#   # 2. 启用 GPU 大模型推理（vLLM 独立容器）
#   docker compose -f docker-compose.prod.yml --profile llm up -d
#
#   # 3. 启用生产全栈监控（Prometheus + Grafana）
#   docker compose -f docker-compose.prod.yml --profile monitoring up -d
#
#   # 4. 全量生产套件拉起（Agent + Console + LLM + Redis + Monitoring）
#   docker compose -f docker-compose.prod.yml --profile llm --profile monitoring up -d
#
# ⚠️ 生产前置准备 / Prerequisites:
#   - 准备服务端证书: 创建 deploy/docker-compose/certs/ 目录并放置 tls.crt 与 tls.key
#   - 准备环境变量: cp .env.prod.example .env 并配置密钥与密码
# =============================================================================

# =============================================================================
# 网络定义 / Networks
# =============================================================================
networks:
  # 前端网络：供 Nginx Web UI 与代理向外暴露端口
  frontend:
    driver: bridge

  # 后端内部网络：容器间通信，完全隔离，不对外映射端口
  backend:
    driver: bridge
    internal: true

  # LLM 网络：供 Core 与 vLLM 跨容器通信
  llm:
    driver: bridge
    internal: false

# =============================================================================
# 持久化卷定义 / Volumes
# =============================================================================
volumes:
  # 隐私预算数据库持久化
  budget-db:
    driver: local
  # 审计日志持久化
  audit-logs:
    driver: local
  # 中台微服务数据持久化
  service-hub-data:
    driver: local
  datasource-mgr-data:
    driver: local
  audit-log-data:
    driver: local
  # 分布式限流 Redis 数据持久化
  redis-data:
    driver: local
  # Prometheus 时序监控数据
  prometheus-data:
    driver: local
  # Grafana 面板与用户数据
  grafana-data:
    driver: local

# =============================================================================
# 服务定义 / Services
# =============================================================================
services:

  # ===========================================================================
  # 1. PrivShield 核心隐私计算引擎 (Core Agent)
  #    REST: 8079 | gRPC: 50051 (启用 TLS + API Key Auth)
  # ===========================================================================
  PrivShield:
    image: privshield:1.8.0
    container_name: PrivShield-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    ports:
      - "8079:8079"   # REST API (HTTPS)
      - "50051:50051" # gRPC (TLS)
    environment:
      # 基础网络与服务标识
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_SERVICE_NAME: "PrivShield-prod"
      PRIVACY_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-INFO}"
      PRIVACY_LOG_FORMAT: "json"
      PRIVACY_PROFILE: "/etc/PrivShield/privacy-profile.yaml"
      PRIVACY_BUDGET_DB: "/data/budget/budget.db"

      # 生产安全：TLS 加密
      PRIVACY_TLS_ENABLED: "${PRIVACY_TLS_ENABLED:-true}"
      PRIVACY_TLS_CERT_FILE: "${PRIVACY_TLS_CERT_FILE:-/certs/tls.crt}"
      PRIVACY_TLS_KEY_FILE: "${PRIVACY_TLS_KEY_FILE:-/certs/tls.key}"
      PRIVACY_TLS_CLIENT_AUTH: "${PRIVACY_TLS_CLIENT_AUTH:-none}"

      # 生产安全：API Key 鉴权
      PRIVACY_AUTH_ENABLED: "${PRIVACY_AUTH_ENABLED:-true}"
      PRIVACY_AUTH_EXTERNAL_KEYS_JSON: "${PRIVACY_AUTH_EXTERNAL_KEYS_JSON:-}"

      # 生产安全：速率限制 (连接内置 Redis)
      PRIVACY_RATE_LIMIT_ENABLED: "${PRIVACY_RATE_LIMIT_ENABLED:-true}"
      PRIVACY_RATE_LIMIT_DEFAULT_RPS: "${PRIVACY_RATE_LIMIT_DEFAULT_RPS:-50}"
      PRIVACY_RATE_LIMIT_DEFAULT_BURST: "${PRIVACY_RATE_LIMIT_DEFAULT_BURST:-100}"
      PRIVACY_RATE_LIMIT_REDIS_URL: "${PRIVACY_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}"

      # Layer-3 LLM 连接 (解耦架构)
      PRIVACY_LLM_PROVIDER: "${PRIVACY_LLM_PROVIDER:-vllm}"
      PRIVACY_LLM_API_BASE: "${LLM_API_BASE:-http://vllm:8000/v1}"
      PRIVACY_LLM_MODEL_NAME: "${PRIVACY_LLM_MODEL_NAME:-Qwen3.5-0.8B-Privacy-Classifier-Smoother}"
      PRIVACY_LLM_API_KEY: "${LLM_API_KEY:-EMPTY}"
    volumes:
      - ./privacy-profile.yaml:/etc/PrivShield/privacy-profile.yaml:ro
      - ./certs:/certs:ro
      - ./secrets:/etc/PrivShield/secrets:ro
      - budget-db:/data/budget
      - audit-logs:/var/log/privacy
    networks:
      - backend
      - llm
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -k https://localhost:8079/readyz || curl -fsS http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # ===========================================================================
  # 2. Redis 生产分布式限速与缓存后端
  #    PORT: 6379 (仅后端内部网络可达)
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: PrivShield-redis-prod
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  # ===========================================================================
  # 3. Console Go 高性能后端代理
  #    PORT: 8081
  # ===========================================================================
  console-backend-go:
    image: privacy-console-backend-go:1.8.0
    container_name: privacy-console-backend-go-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    ports:
      - "8081:8081"
    environment:
      PRIVACY_CONSOLE_HOST: "0.0.0.0"
      PRIVACY_CONSOLE_PORT: "8081"
      PRIVACY_AGENT_GRPC_HOST: "PrivShield"
      PRIVACY_AGENT_GRPC_PORT: "50051"
      PRIVACY_AGENT_URL: "https://PrivShield:8079"
      PRIVACY_AGENT_TLS_INSECURE: "true"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  # ===========================================================================
  # 4. Console Nginx 前端 Web UI
  #    PORT: 5173
  # ===========================================================================
  console-web:
    image: privacy-console-web:1.8.0
    container_name: privacy-console-web-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    ports:
      - "5173:5173"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: always

  # ===========================================================================
  # 5. Service Hub 数据服务调度中枢
  #    PORT: 8082
  # ===========================================================================
  service-hub:
    image: privshield-service-hub:1.8.0
    container_name: privshield-service-hub-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    ports:
      - "8082:8082"
    volumes:
      - service-hub-data:/app/data
    environment:
      SERVICE_HUB_HOST: "0.0.0.0"
      SERVICE_HUB_PORT: "8082"
      PRIVACY_AGENT_REST_HOST: "PrivShield"
      PRIVACY_REST_PORT: "8079"
      SERVICE_HUB_DB_PATH: "/app/data/service-hub.db"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: always

  # ===========================================================================
  # 6. Datasource Manager 数据源管理
  #    PORT: 8083
  # ===========================================================================
  datasource-mgr:
    image: privshield-datasource-mgr:1.8.0
    container_name: privshield-datasource-mgr-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    ports:
      - "8083:8083"
    volumes:
      - datasource-mgr-data:/app/data
    environment:
      DATASOURCE_MGR_HOST: "0.0.0.0"
      DATASOURCE_MGR_PORT: "8083"
      PRIVACY_AGENT_REST_HOST: "PrivShield"
      PRIVACY_REST_PORT: "8079"
      DATASOURCE_MGR_DB_PATH: "/app/data/datasource-mgr.db"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: always

  # ===========================================================================
  # 7. Audit Log 脱敏审计日志
  #    PORT: 8084
  # ===========================================================================
  audit-log:
    image: privshield-audit-log:1.8.0
    container_name: privshield-audit-log-prod
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    ports:
      - "8084:8084"
    volumes:
      - audit-log-data:/app/data
    environment:
      AUDIT_LOG_HOST: "0.0.0.0"
      AUDIT_LOG_PORT: "8084"
      AUDIT_LOG_DB_PATH: "/app/data/audit-log.db"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: always

  # ===========================================================================
  # 8. Layer-3 vLLM GPU 推理服务 (Profile: llm)
  #    PORT: 8000
  # ===========================================================================
  vllm:
    profiles: ["llm"]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    container_name: PrivShield-vllm-prod
    command:
      - "--model"
      - "/models/Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--served-model-name"
      - "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--max-model-len"
      - "4096"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ../../.models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - llm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    restart: always

  # ===========================================================================
  # 6. Prometheus 生产监控指标采集 (Profile: monitoring)
  #    PORT: 9090
  # ===========================================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: PrivShield-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/rules/PrivShield-alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - frontend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  # ===========================================================================
  # 7. Grafana 可视化监控大屏 (Profile: monitoring)
  #    PORT: 3000
  # ===========================================================================
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: PrivShield-grafana-prod
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env for production}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - frontend
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always
