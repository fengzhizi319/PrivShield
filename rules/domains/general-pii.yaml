# 通用个人信息规则 (GB/T 35273)
domain: "general-pii"
version: "1.0.0"
description: "通用个人信息规则 (GB/T 35273)"

rules:
  # --- 身份证 ---
  - id: "RULE_PII_IDCARD"
    name: "中国大陆身份证"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "id_card_checksum"
        params: {}

  # --- 手机号 ---
  - id: "RULE_PII_PHONE"
    name: "中国大陆手机号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "^1[3-9]\\d{9}$"

  # --- 医保卡号 ---
  - id: "RULE_PII_MEDICAL_CARD"
    name: "医保卡号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "medical_card_checksum"
        params: {}

  # --- 联系方式/位置字段名 ---
  - id: "RULE_PII_CONTACT"
    name: "联系方式/位置字段"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["email", "address", "location", "轨迹", "phone", "mobile", "tel"]

  # --- 生物识别信息 ---
  - id: "RULE_PII_BIOMETRIC"
    name: "生物识别信息"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["fingerprint", "voiceprint", "palmprint", "iris", "face", "biometric"]

  # --- 姓名字段 ---
  - id: "RULE_PII_NAME"
    name: "姓名/身份证字段名"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 40
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["id_card", "idcard", "identity", "身份证", "passport"]

downgrade_rules:
  - id: "RULE_DOWN_PUBLIC"
    name: "公开数据降级"
    keywords: ["public_report", "annual_summary", "科普", "公开"]
    level: "L1"
    category: "PUBLIC_REPORT"
  - id: "RULE_DOWN_OPS"
    name: "运营统计降级"
    keywords: ["turnover_rate", "device_usage", "inventory", "统计"]
    level: "L2"
    category: "OPERATIONAL_STAT"

composite_rules:
  - id: "COMP_PII_001"
    name: "高敏感个人信息组合"
    field_patterns: ["^name$", "id_card|idcard|identity", "mobile|phone|cell"]
    min_matches: 3
    target_level: "L5"
    category: "COMPOSITE_PII_COMBO"
