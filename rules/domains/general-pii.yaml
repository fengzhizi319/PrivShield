# 通用个人信息规则 (GB/T 35273)
domain: "general-pii"
version: "1.0.0"
description: "通用个人信息规则 (GB/T 35273)"

rules:
  # --- 身份证 ---
  - id: "RULE_PII_IDCARD"
    name: "中国大陆身份证"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "id_card_checksum"
        params: {}

  # --- 手机号 ---
  - id: "RULE_PII_PHONE"
    name: "中国大陆手机号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "^1[3-9]\\d{9}$"

  # --- 医保卡号 ---
  - id: "RULE_PII_MEDICAL_CARD"
    name: "医保卡号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    matchers:
      - target: "field_value"
        operator: "medical_card_checksum"
        params: {}

  # --- 联系方式/位置字段名 ---
  - id: "RULE_PII_CONTACT"
    name: "联系方式/位置字段"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["email", "address", "location", "轨迹", "phone", "mobile", "tel"]
          use_word_boundaries: true

  # --- 生物识别信息 ---
  - id: "RULE_PII_BIOMETRIC"
    name: "生物识别信息"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["fingerprint", "voiceprint", "palmprint", "iris", "face", "biometric"]
          use_word_boundaries: true

  # --- 姓名字段 ---
  - id: "RULE_PII_NAME"
    name: "姓名/身份证字段名"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 40
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["idcard", "identity", "身份证", "passport"]

downgrade_rules:
  - id: "general-pii:RULE_DOWN_PUBLIC"
    name: "公开数据降级"
    keywords: ["public_report", "annual_summary", "科普", "公开"]
    level: "L1"
    category: "PUBLIC_REPORT"
  - id: "general-pii:RULE_DOWN_OPS"
    name: "运营统计强制降级"
    # 注意: 关键词必须足够精确，避免压制值级 PII 命中。
    # "统计" 过宽（会匹配 "患者统计" 等含 PII 的字段），已替换为更精确的关键词。
    # force_suppress 压制仅影响 match_target=field_name 的标签，值级命中（field_value）永远豁免。
    keywords: ["turnover_rate", "device_usage", "inventory", "门诊人次", "床位统计", "工作量统计"]
    level: "L2"
    category: "OPERATIONAL_STAT"
    force_suppress: true        # 启用强制覆盖
    # 【配置提示 / Tip】: 开启 force_suppress: true 时，务必根据需要显式配置 max_force_suppress_level。
    # 若未指定，默认仅压制 <= level(L2) 的标签。显式配置 max_force_suppress_level: "L3" (或 "L4")
    # 才能将原本被通用规则误中而标记为 L3/L4 的高敏感标签强制压制并降级为 L2。
    max_force_suppress_level: "L3"    # 仅压制 L3 及以下（且仅压制字段名命中，值级命中豁免）

composite_rules:
  - id: "COMP_PII_001"
    name: "高敏感个人信息组合"
    field_patterns: ["name", "idcard|identity", "mobile|phone|cell"]
    min_matches: 3
    target_level: "L5"
    category: "COMPOSITE_PII_COMBO"