# 四川省健康医疗大数据应用指南 (DB51/T 2851-2021)
domain: "sc_health_db51"
version: "1.0.0"
description: "从文档 四川省健康医疗大数据应用指南.md 自动抽取的分类分级规则包"

# ==============================================================================
# 1. 普通分类规则 (rules)
# 常用字段包含：id, name, category, level, priority, match_logic, matchers
# ==============================================================================
rules:
  - id: "RULE_SC_HEALTH_DB51_IDCARD"
    name: "身份证件号码检测"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 90
    match_logic: "OR"                     # 匹配逻辑: AND (全部匹配) 或 OR (任意匹配)
    matchers:
      - target: "field_value"              # 匹配目标: field_name (字段名), field_value (数据值), 或 both
        operator: "id_card_checksum"       # 算法算子
        params: {}
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["idcard", "sfz", "identity", "id_card", "身份证"]

  - id: "RULE_SC_HEALTH_DB51_PHONE"
    name: "手机号码检测"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 80
    match_logic: "OR"
    matchers:
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "^1[3-9]\\d{9}$"
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["mobile", "phone", "cell", "电话", "手机"]

  - id: "RULE_SC_HEALTH_DB51_BANKCARD"
    name: "支付金融账户检测"
    category: "FINANCIAL_ACCOUNT"
    level: "L3"
    priority: 85
    match_logic: "OR"
    matchers:
      - target: "field_value"
        operator: "luhn_checksum"
        params:
          min_length: 13
          max_length: 19
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["bankcard", "cardno", "card_no", "bank_card", "支付卡号"]

  - id: "RULE_SC_HEALTH_DB51_DISEASE"
    name: "敏感病种检测"
    category: "MEDICAL_TREATMENT"
    level: "L4"
    priority: 95
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["hiv", "aids", "std", "syphilis", "psychiatric", "schizophrenia", "艾滋病", "性病", "精神病"]

  - id: "RULE_SC_HEALTH_DB51_GENOMIC"
    name: "个人遗传基因数据检测"
    category: "GENOMIC"
    level: "L5"
    priority: 100
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["gene", "genomic", "brca", "tp53", "snp", "cnv", "chromosome", "thalassemia", "基因", "染色体", "地中海贫血"]

# ==============================================================================
# 2. 敏感度降级与覆盖规则 (downgrade_rules)
# 可用字段包含：id, name, keywords, level, category, force_suppress, max_force_suppress_level, exempt_rules
# ==============================================================================
downgrade_rules:
  - id: "DOWN_SC_HEALTH_DB51_OPS"
    name: "运营统计指标降级示例"
    keywords: ["turnover", "inventory", "device_usage", "开机次数", "门诊人次", "运行时间"]
    level: "L2"
    category: "MANAGEMENT"
    force_suppress: false                 # 是否开启强制压制擦除普通规则标签 (true/false)
    max_force_suppress_level: ""          # 强行覆盖上限等级 (如 'L3'，空=使用规则自身 level 作为上限)
    exempt_rules: []                      # 压制豁免例外名单 (空=没有例外全额压制；列表填入的规则 ID 或通配符如 '*_EXACT' 豁免不被压制)

# ==============================================================================
# 3. 组合/上下文增强规则 (composite_rules)
# 可用字段包含：id, name, field_patterns, min_matches, target_level, category, table_name_pattern, boost_level
# ==============================================================================
composite_rules:
  - id: "COMP_SC_HEALTH_001"
    name: "四川健康医疗组合规则模板示例"
    field_patterns: ["idcard|identity", "mobile|phone", "bankcard|cardno"]
    min_matches: 2
    target_level: "L4"
    category: "COMPOSITE_SC_HEALTH_COMBO"
    table_name_pattern: ""                # 表名正则限制 (空=匹配任意表)
    boost_level: ""                       # 提级配置 (空=直接使用 target_level)
