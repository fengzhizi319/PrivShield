# 医疗健康领域分类规则（含基因组、ICD-10、敏感病种）
domain: "medical"
version: "1.0.0"
description: "医疗健康领域分类规则（含基因组、ICD-10、敏感病种）"

# ==============================================================================
# 1. 普通分类规则 (rules)
# 常用字段包含：id, name, category, level, priority, match_logic, matchers
# ==============================================================================
rules:
  # --- 基因组字段名规则 ---
  - id: "RULE_MED_G_001"
    name: "BRCA/TP53 基因指标"
    category: "GENOMIC"
    level: "L5"
    priority: 200
    match_logic: "AND"                     # 匹配逻辑: AND (全部匹配) 或 OR (任意匹配)
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "brca1", "brca2", "tp53", "egfr", "kras", "braf", "alk", "pik3ca", "erbb2", "her2"
          ]
          use_word_boundaries: false

  - id: "RULE_MED_G_002"
    name: "基因组变异指标"
    category: "GENOMIC"
    level: "L5"
    priority: 200
    match_logic: "OR"                      # 多个 matcher 满足任意一个即可命中
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "snp", "cnv", "indel", "sv", "mutation", "variant", "genome", "genomic",
            "dna", "rna", "sequencing", "chromosome", "基因组", "变异", "突变", "单核苷酸多态性"
          ]
          use_word_boundaries: false
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "^rs\\d+$"

  - id: "RULE_MED_G_003"
    name: "基因组文件格式"
    category: "GENOMIC"
    level: "L5"
    priority: 200
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: ["bam", "vcf", "fastq", "fasta", "cram", "bed", "gff", "gtf"]
          use_word_boundaries: false

  # --- 敏感病种字段名规则 ---
  - id: "RULE_MED_DISEASE_001"
    name: "敏感病种字段"
    category: "MEDICAL_TREATMENT"
    level: "L4"
    priority: 150
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "hiv", "aids", "std", "syphilis", "gonorrhea", "psychiatric", "schizophrenia",
            "depression", "mental", "cancer", "tumor", "oncology", "tuberculosis", "hepatitis",
            "艾滋病", "性病", "梅毒", "淋病", "精神病", "精神分裂", "抑抑症", "肿瘤", "癌症", "结核", "乙肝"
          ]
          use_word_boundaries: false

  # --- ICD-10 值规则 ---
  - id: "RULE_MED_ICD10"
    name: "ICD-10 医疗编码"
    category: "MEDICAL_TREATMENT"
    level: "L3"
    priority: 120
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "icd10_range"
        params:
          default_level: "L3"
          upgrade_level: "L4"
          intervals:
            - {start: "B20", end: "B24", category: "MEDICAL_ICD10_HIV"}
            - {start: "A50", end: "A53", category: "MEDICAL_ICD10_STD"}
            - {start: "A54", end: "A64", category: "MEDICAL_ICD10_STD"}
            - {start: "F20", end: "F29", category: "MEDICAL_ICD10_PSYCHIATRIC"}
            - {start: "C00", end: "C97", category: "MEDICAL_ICD10_CANCER"}

  # --- 基因组文件内容检测 ---
  - id: "RULE_MED_FILE_BAM"
    name: "BAM 文件头检测"
    category: "GENOMIC"
    level: "L5"
    priority: 180
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "prefix_match"
        params:
          prefixes: ["BAM\u0001", "@SQ"]

  - id: "RULE_MED_FILE_VCF"
    name: "VCF 文件头检测"
    category: "GENOMIC"
    level: "L5"
    priority: 180
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "prefix_match"
        params:
          prefixes: ["##fileformat=VCF"]

  - id: "RULE_MED_SEQ"
    name: "碱基序列检测"
    category: "GENOMIC"
    level: "L5"
    priority: 180
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "[ATCGNatcgn]{50,}"

# ==============================================================================
# 2. 敏感度降级与覆盖规则 (downgrade_rules)
# 可用字段包含：id, name, keywords, level, category, force_suppress, max_force_suppress_level, exempt_rules
# ==============================================================================
downgrade_rules:
  - id: "medical:RULE_DOWN_PUBLIC"
    name: "公开报告降级"
    keywords: ["public_report", "annual_summary", "科普", "公开", "宣传", "健康宣教", "medical_knowledge"]
    level: "L1"
    category: "PUBLIC_REPORT"
    force_suppress: false                 # 是否开启强制压制擦除
    max_force_suppress_level: ""          # 压制上限等级 (空=使用规则自身 level 作为上限)
    exempt_rules: []                      # 压制豁免例外名单 (空=没有例外全额压制)

  - id: "medical:RULE_DOWN_OPS"
    name: "运营统计强制降级"
    keywords: [
      "turnover_rate", "device_usage", "inventory", "hospital_stat", "bed_occupancy",
      "stat", "stat_count", "cnt", "门诊量", "住院人次", "设备利用率", "床位周转率", "库存统计", "工作量"
    ]
    level: "L2"
    category: "OPERATIONAL_STAT"
    force_suppress: true                  # 启用强制覆盖: 可压制符合条件的误中普通规则标签
    max_force_suppress_level: "L3"        # 强行覆盖上限: 可把误标为 L3 的普通规则压制降至 L2
    exempt_rules: ["RULE_PII_BANK_CARD"]  # 银行卡规则豁免强制降级

# ==============================================================================
# 3. 组合/上下文增强规则 (composite_rules)
# 可用字段包含：id, name, field_patterns, min_matches, target_level, category, table_name_pattern, boost_level
# ==============================================================================
composite_rules:
  - id: "COMP_MED_001"
    name: "医疗基因组合"
    field_patterns: ["diagnosis", "disease", "illness", "gene", "genomic", "mutation", "brca", "tp53"]
    min_matches: 2
    target_level: "L5"
    category: "COMPOSITE_MEDICAL_GENOMIC"
    table_name_pattern: ""                # 表名正则限制 (空=匹配任意表)
    boost_level: ""                       # 提级配置 (空=直接使用 target_level)