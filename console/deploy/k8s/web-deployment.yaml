apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-web
  labels:
    app.kubernetes.io/name: console-web
    app.kubernetes.io/component: console-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-web
        app.kubernetes.io/component: console-frontend
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-web
          image: privacy-console-web:1.8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
