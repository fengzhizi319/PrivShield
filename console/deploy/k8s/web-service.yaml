apiVersion: v1
kind: Service
metadata:
  name: console-web
  labels:
    app.kubernetes.io/name: console-web
    app.kubernetes.io/component: console-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: console-web
  ports:
    - name: http
      port: 5173
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/http
